[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "simplep2g"
version = "0.1.0"
description = "Predict spatial gene expression from pathology images with frozen image encoders."
readme = "README.md"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "accelerate==1.15.0",
  "anndata==0.10.9",
  "einops==0.8.2",
  "h5py==3.16.0",
  "huggingface-hub==0.36.0",
  "numpy==1.26.4",
  "omegaconf==2.3.1",
  "openslide-bin==4.0.1.2",
  "openslide-python==1.4.6",
  "pandas==2.2.3",
  "pillow==12.3.0",
  "pyyaml==6.0.3",
  "safetensors==0.8.0",
  "scanpy==1.10.4",
  "scikit-learn==1.9.1",
  "scipy==1.17.1",
  "timm==1.0.30",
  "torch==2.10.0",
  "torch-geometric==2.8.0.post1",
  "torchvision==0.25.0",
  "tqdm==4.70.1",
]

[project.scripts]
simplep2g-train = "src.train_main:main"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
include = ["/src/**/*.py"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "pyproject.toml", "README.md", "LICENSE", "THIRD_PARTY_NOTICES.md"]
include = ["/src/**/*.py", "/pyproject.toml", "/README.md", "/LICENSE", "/THIRD_PARTY_NOTICES.md"]

[tool.ruff]
target-version = "py312"
line-length = 119

[tool.ruff.lint]
# Never enforce `E501` (line length violations).
ignore = ["C901", "E501", "E741", "F402", "F823"]
select = ["C", "E", "F", "I", "W", "RUF013"]

# Ignore import violations in all `__init__.py` files.
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401", "F403", "F811"]

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["src"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
