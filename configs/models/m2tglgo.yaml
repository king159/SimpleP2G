num_workers: 0
per_gpu_batch_size: 1
num_genes: 200
image_encoder: virchow2
cond_size: 2560
model: m2tglgo
training:
  enable_tf32: true
hidden_dim: 512
m2_gene_dim: 512
m2_gnn_type: gat
gat_heads: 4
dropout: 0.2
n_neighbors: 8
m2_alpha: 0.75
m2_graph_loss_weight: 0.01
max_spots: 1024
max_grad_norm: 1.0
warmup_steps: 50
cosine_decay: true
min_lr_ratio: 0.1
optimizer:
  name: adamw
  lr: 0.0001
  weight_decay: 0.0001
  betas:
  - 0.9
  - 0.999
pair_role: enhanced_encoder
encoder_label: Virchow2
protocol_file: configs/protocols/benchmark.yaml
