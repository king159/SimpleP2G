num_workers: 0
per_gpu_batch_size: 1
num_genes: 200
image_encoder: virchow2
cond_size: 2560
model: stflow
hidden_dim: 128
pairwise_hidden_dim: 128
n_layers: 4
n_heads: 4
dropout: 0.2
attn_dropout: 0.2
n_neighbors: 8
activation: gelu
n_sample_steps: 5
prior_sampler: zinb
zinb_total_count: 1.0
zinb_logits: 0.1
zinb_zi_logits: 0.0
max_grad_norm: 1.0
warmup_steps: 100
cosine_decay: true
min_lr_ratio: 0.1
optimizer:
  name: adamw
  lr: 0.0005
  weight_decay: 0.0
  betas:
  - 0.9
  - 0.999
pair_role: enhanced_encoder
encoder_label: Virchow2
protocol_file: configs/protocols/benchmark.yaml
