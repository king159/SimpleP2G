num_workers: 0
per_gpu_batch_size: 256
num_genes: 200
image_encoder: virchow2
cond_size: 2560
num_aug_ratio: 2
model: ours
decoder_depth: 12
hidden_size: 384
num_heads: 6
loss_name: gaussian_nll
max_grad_norm: 1.0
warmup_steps: 1000
dropout: 0.05
num_cond_tokens: 4
cosine_decay: true
min_lr_ratio: 0.1
ema_decay: 0.999
optimizer:
  name: adamw
  lr: 5.0e-05
  weight_decay: 0.05
  betas:
  - 0.9
  - 0.999
protocol_file: configs/protocols/benchmark.yaml
cohort_overrides:
  prad:
    warmup_steps: 300
    dropout: 0.1
    optimizer:
      lr: 3.0e-05
      weight_decay: 0.1
  her2st:
    dropout: 0.0
    optimizer:
      lr: 0.0001
  lung:
    dropout: 0.0
  ccrcc:
    warmup_steps: 500
    dropout: 0.1
    optimizer:
      lr: 3.0e-05
      weight_decay: 0.1
